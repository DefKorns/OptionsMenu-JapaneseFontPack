name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # On a tag push (release build), force MOD_VER to the tag name itself
      # rather than trusting `git describe` - checkout is shallow by default
      # and describe can't reliably resolve tags without full history.
      - name: Build hmod
        run: |
          MOD_VER_ARG=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            MOD_VER_ARG="MOD_VER=${{ github.ref_name }}"
          fi
          make $MOD_VER_ARG

      - name: Upload .hmod build artifact
        uses: actions/upload-artifact@v7
        with:
          name: japanese-font-pack-hmod
          path: out/*.hmod

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: japanese-font-pack-hmod
          path: out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: out/*.hmod
          generate_release_notes: true
